policy_summary:
  economic_position: "혁신성장과 경제민주화 병행. 재벌 개혁, 중소기업·자영업 지원 강화. 민간 투자 촉진과 공정한 분배를 함께 추구."
  welfare_position: "기본사회 강령 채택. 보편복지 지향, 기본소득·기본금융·기본주거·기본돌봄 체계 구축 목표."
  labor_position: "노동존중사회 표방. 주 4.5일 근무제 추진, 5인 미만 사업장 근로기준법 적용, 노동권 강화."
  housing_position: "주거권을 기본권으로 규정. 실거주·실수요자 보호, 공공주택 공급 확대, 전세사기 피해자 지원."
  foreign_policy_position: "한미동맹 유지, 대북 관여정책 선호, 남북 대화·교류 재개 지지. 다자외교 및 동북아 평화 강조."
  security_position: "강력한 안보 유지하되 외교적 해결 우선. 핵 억지력 강화와 동시에 대화 채널 유지 지지."
  climate_energy_position: "2050 탄소중립 목표 지지. 재생에너지 비중 확대, 원전은 안전 기준 충족 시 단계적 관리."
  digital_policy_position: "AI·디지털 혁신 지원, 플랫폼 독점 규제, 디지털 노동자 권리 보호. 데이터 주권 강화."
  political_reform_position: "검찰 권한 축소, 공수처 강화, 선거제도 개혁(비례성 강화), 지방분권 확대."
  social_cultural_position: "언론 자유 강조, 역사 바로잡기(친일·독재 청산), 다문화 사회 포용, 차별금지 입법 추진."
  priority_policy_areas:
