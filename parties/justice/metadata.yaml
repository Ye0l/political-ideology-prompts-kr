  foreign_policy_position: "자주 외교. 한미동맹 불평등 관계 개선. 비핵화 협상 우선."
  security_position: "평화 지향. 군비 축소. 한반도 비핵화."
  climate_energy_position: "기후위기 비상 선언. 탈석탄·탈핵. 재생에너지 100% 전환. 기후정의."
  digital_policy_position: "플랫폼 노동자 권리 보호. AI·디지털 전환의 노동 영향 규제."
  political_reform_position: "연동형 비례대표제. 소수 정당 보호. 직접민주주의 확대."
  social_cultural_position: "차별금지법 제정. 성소수자 권리. 이민·다문화 포용. 페미니즘."
