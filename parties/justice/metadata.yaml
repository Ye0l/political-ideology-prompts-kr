policy_summary:
  economic_position: "재벌 개혁, 불평등 해소. 노동자 주도 경제민주화. 공공성 강화."
  welfare_position: "보편복지. 무상 의료·교육·주거. 사회안전망 대폭 확충."
  labor_position: "비정규직 정규직화. 최저임금 대폭 인상. 노동시간 단축. 노조 권리 강화."
