policy_summary:
  economic_position: "초국적 자본·재벌 독점 해체. 민중 경제주권 강화. 자주자립 경제체제 확립. 대외의존 경제 탈피."
  welfare_position: "보편복지사회 실현. 교육·의료·주거·이동·에너지·정보이용 무상 제공."
  labor_position: "비정규직 제도 폐기. 노동중심사회 실현. 산업재해 근절. 노동자 안전 권리 보장."
  housing_position: "주거권 무상 보장 지향. 공공주택 확대."
  foreign_policy_position: "자주외교. 한미동맹 재검토 또는 변화 주장. 남북 공동선언 이행. 자주통일."
  security_position: "평화 통일. 외국군 기지 축소·철수 지향. 군비 감축 선호."
  climate_energy_position: "에너지 자립, 재생에너지 전환. 탈핵."
  digital_policy_position: "디지털 노동자 권리 보호. 추가 확인 필요."
  political_reform_position: "민중주권 강화. 직접민주주의 확대. 재벌과 결탁한 기득권 정치 타파."
  social_cultural_position: "성평등, 소수자 권리 (강령에 명시). 다양성 존중."
