policy_summary:
  economic_position: "규제 완화와 민간 투자 촉진 중심. 감세를 통한 성장 유인. 대기업·수출 중심 경제 성장 선호."
  welfare_position: "선별복지 선호. 저출생 대응에 집중. 복지는 효율과 재정 건전성을 고려한 선별 지원."
  labor_position: "노동시장 유연화 선호. 규제 완화로 고용 창출. 육아·가족 친화 노동환경 강조 (저출생 대응 연계)."
  housing_position: "공급 확대 중심. 재건축·재개발 규제 완화, 민간 공급 활성화. 세금 부담 완화."
  foreign_policy_position: "강력한 한미동맹. 원칙 있는 대북정책. 압박을 통한 북핵 문제 해결 선호. 한일관계 개선 적극적."
  security_position: "확장억제 강화, 한미 동맹 공고화, 핵우산 신뢰성 제고. 강경 대북 노선 선호."
  climate_energy_position: "원전·재생에너지 균형 확충. 탈원전 정책 폐기. 원전을 청정 에너지원으로 인정."
  digital_policy_position: "규제 완화를 통한 스타트업·AI 산업 육성. 플랫폼 규제는 신중한 접근."
  political_reform_position: "정당 개혁, 당내 쇄신. 윤석열 전 대통령과의 절연 및 당 이미지 쇄신 중."
  social_cultural_position: "건국 정신 강조, 전통 가치 존중. 표현의 자유 보호. 역사 교육에서 긍정적 측면 강조."
  priority_policy_areas:
